name: Monitor Google Drive API

on:
  schedule:
    - cron: '0 8 * * 4'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore revision state from bot-state branch
        run: |
          mkdir -p .github/api-revisions
          git fetch origin bot-state 2>/dev/null || true
          git show origin/bot-state:.github/api-revisions/gdrive-revision.json \
            > .github/api-revisions/gdrive-revision.json 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & core-lib with gdrive extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gdrive,discord,dev]

      - name: Run GDrive Update Bot
        id: check
        run: python scripts/gdrive_update_bot.py
        continue-on-error: true

      - name: Open issue — revision changed
        if: steps.check.outputs.result == 'revision_changed'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 Google Drive API revision changed',
                body: [
                  'The automated monitor detected a **revision change** in the Google Drive API v3 discovery document.',
                  '',
                  'Please review the [API changelog](https://developers.google.com/drive/api/guides/v3-revisions) and verify compatibility with `core_lib.gdrive`.',
                  '',
                  'Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                ].join('\n'),
                labels: ['api-monitor', 'needs-review'],
              });
            } catch (err) {
              console.log('Failed to create issue with labels, retrying without labels:', err);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 Google Drive API revision changed',
                body: 'Revision changed. Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            }

      - name: Open issue — network or parse failure
        if: steps.check.outputs.result == 'error'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Google Drive API monitor failed (network/parse error)',
                body: [
                  'The automated Google Drive API monitor failed due to a **network or parse error**.',
                  '',
                  'Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                ].join('\n'),
                labels: ['api-monitor', 'bug'],
              });
            } catch (err) {
              console.log('Failed to create issue with labels, retrying without labels:', err);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Google Drive API monitor failed (network/parse error)',
                body: 'Monitor failed. Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            }

      - name: Commit updated revision state to bot-state branch
        if: steps.check.outputs.result == 'ok' || steps.check.outputs.result == 'revision_changed'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_FILE=".github/api-revisions/gdrive-revision.json"
          TMP_STATE=$(mktemp)
          cp "$STATE_FILE" "$TMP_STATE"
          rm -f "$STATE_FILE"

          if git fetch origin bot-state 2>/dev/null; then
            git checkout -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf . --quiet || true
          fi

          mkdir -p .github/api-revisions
          cp "$TMP_STATE" "$STATE_FILE"

          git add "$STATE_FILE"
          git diff --cached --quiet && exit 0

          git commit -m "chore(monitor): update Google Drive API revision state [skip ci]"

          if [ "${ACT}" == "true" ]; then
            echo "Running locally via act - skipping git push."
          else
            git push origin bot-state
          fi

      - name: Send Discord Notification
        if: always()
        env:
          INFRA_ALERTS_DISCORD_WEBHOOK: ${{ secrets.INFRA_ALERTS_DISCORD_WEBHOOK }}
          CHECK_RESULT: ${{ steps.check.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$INFRA_ALERTS_DISCORD_WEBHOOK" ]; then
            echo "INFRA_ALERTS_DISCORD_WEBHOOK not set, skipping."
            exit 0
          fi

          if [ "$CHECK_RESULT" = "ok" ]; then
            MSG="✅ **Google Drive API Monitor**: No changes detected.\n🔗 $RUN_URL"
          elif [ "$CHECK_RESULT" = "revision_changed" ]; then
            MSG="📋 **Google Drive API Monitor**: API revision changed!\n🔗 $RUN_URL"
          else
            MSG="🚨 **Google Drive API Monitor**: Failed (result=${CHECK_RESULT}).\n🔗 $RUN_URL"
          fi

          PAYLOAD=$(printf '{"content":"%s"}' "$MSG")
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$INFRA_ALERTS_DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Discord notification sent (HTTP $HTTP_STATUS)."
          else
            echo "Discord notification failed (HTTP $HTTP_STATUS)."
            exit 1
          fi
