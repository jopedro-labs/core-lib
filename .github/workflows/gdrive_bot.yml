name: Monitor Google Drive API

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & core-lib with gdrive extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gdrive,dev]

      - name: Run unit tests
        run: pytest tests/test_gdrive_update_bot.py -v

      - name: Run GDrive Update Bot
        id: check
        run: python scripts/gdrive_update_bot.py
        continue-on-error: true

      - name: Open issue — revision changed
        if: steps.check.outputs.result == 'revision_changed'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 Google Drive API revision changed',
                body: [
                  'The automated monitor detected a **revision change** in the Google Drive API v3 discovery document.',
                  '',
                  'Please review the [API changelog](https://developers.google.com/drive/api/guides/v3-revisions) and verify compatibility with `core_lib.gdrive`.',
                  '',
                  'Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                ].join('\n'),
                labels: ['api-monitor', 'needs-review'],
              });
            } catch (err) {
              console.log('Failed to create issue with labels, retrying without labels:', err);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 Google Drive API revision changed',
                body: 'Revision changed. Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            }

      - name: Open issue — network or parse failure
        if: steps.check.outputs.result == 'error'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Google Drive API monitor failed (network/parse error)',
                body: [
                  'The automated Google Drive API monitor failed due to a **network or parse error**.',
                  '',
                  'Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                ].join('\n'),
                labels: ['api-monitor', 'bug'],
              });
            } catch (err) {
              console.log('Failed to create issue with labels, retrying without labels:', err);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Google Drive API monitor failed (network/parse error)',
                body: 'Monitor failed. Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              });
            }

      - name: Commit updated revision state
        if: steps.check.outputs.result == 'ok' || steps.check.outputs.result == 'revision_changed'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitor): update Google Drive API revision state [skip ci]"
          file_pattern: ".github/api-revisions/*.json"
          push_options: '--force'
