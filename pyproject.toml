[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jopedro-core-lib"
version = "0.3.0"
description = "Shared support library"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
discord = [
    "requests>=2.28",
]
gdrive = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.28",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core_lib*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["core_lib"]

[[tool.mypy.overrides]]
# google-auth provides PEP 561 (py.typed) marker but omits type annotations on key methods:
# - google.oauth2.credentials.Credentials.from_authorized_user_file (classmethod)
# - google.oauth2.credentials.Credentials.refresh
# Calling these directly in strict mode triggers [no-untyped-call].
# This override is strictly isolated to core_lib.gdrive.gdrive_auth.
module = [
    "core_lib.gdrive.gdrive_auth",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
